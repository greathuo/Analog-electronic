<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPN型BJT内部载流子运动</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .wire { stroke: #000; stroke-width: 1.5; fill: none; }
        .indent-2 { text-indent: 2em; }
    </style>
</head>
<body class="bg-transparent p-4 md:p-8 m-0">
<div class="max-w-5xl mx-auto p-0">
    <h1 class="text-2 md:text-3 font-bold text-center mb-6">
        NPN型BJT内部载流子运动
    </h1>

    <p class="text-left indent-2 mb-2">
        BJT发射结正偏，集电结反偏，工作在放大状态。
    </p>
    <p class="text-left indent-2 mb-2">
        <strong>1. 发射区提供载流子：</strong>发射结外加正向电压，发射区高浓度自由电子大量注入基区，形成扩散电流。
    </p>
    <p class="text-left indent-2 mb-2">
        <strong>2. 基区运输与载流子：</strong>基区很薄且掺杂浓度低，少数自由电子与空穴复合，大部分自由电子到达集电结边缘。
    </p>
    <p class="text-left indent-2 mb-0">
        <strong>3. 集电区收集载流子：</strong>集电结反偏强电场将自由电子收集进集电区，形成集电极电流，实现放大作用。
    </p>
  
    <div class="w-full flex justify-center mt-0">
        <svg viewBox="70 60 700 360" 
             xmlns="http://www.w3.org/2000/svg" 
             class="w-full max-w-[720px] h-auto"
             style="transform: scale(1.8); transform-origin: center top;">
            <g transform="translate(300,100)">
                <rect x="0" y="0" width="80" height="100" fill="#E8A87C" stroke="#999" />
                <text x="40" y="-5" text-anchor="middle" font-size="12">发射区(N)</text>
                <rect x="80" y="0" width="50" height="100" fill="#8ECAE6" stroke="#999" />
                <text x="105" y="-5" text-anchor="middle" font-size="12">基区(P)</text>
                <rect x="130" y="0" width="120" height="100" fill="#E8A87C" stroke="#999" />
                <text x="190" y="-5" text-anchor="middle" font-size="12">集电区(N)</text>
                <rect x="-10" y="30" width="10" height="40" fill="#888" />
                <text x="-15" y="65" text-anchor="end" font-size="14" font-weight="bold">E</text>
                <rect x="85" y="100" width="40" height="10" fill="#888" />
                <text x="95" y="125" text-anchor="middle" font-size="14" font-weight="bold">B</text>
                <rect x="250" y="30" width="10" height="40" fill="#888" />
                <text x="265" y="65" text-anchor="start" font-size="14" font-weight="bold">C</text>
                
                <rect x="70" y="0" width="20" height="100" fill="#666" opacity="0.4"/>
                <rect x="110" y="0" width="40" height="100" fill="#666" opacity="0.4"/>

                <!-- 原有空穴：复合时变淡，循环重置 -->
                <circle cx="90" cy="30" r="3" stroke="black" stroke-width="1" fill="white">
                    <animate attributeName="opacity" from="1" to="0.3" dur="0.2s" begin="0.8s" fill="freeze"/>
                    <animate attributeName="opacity" from="1" to="1" dur="0s" begin="2.2s" fill="freeze"/>
                </circle>
                <circle cx="100" cy="50" r="3" stroke="black" stroke-width="1" fill="white">
                    <animate attributeName="opacity" from="1" to="0.3" dur="0.2s" begin="0.8s" fill="freeze"/>
                    <animate attributeName="opacity" from="1" to="1" dur="0s" begin="2.2s" fill="freeze"/>
                </circle>
                <circle cx="95" cy="70" r="3" stroke="black" stroke-width="1" fill="white">
                    <animate attributeName="opacity" from="1" to="0.3" dur="0.2s" begin="0.8s" fill="freeze"/>
                    <animate attributeName="opacity" from="1" to="1" dur="0s" begin="2.2s" fill="freeze"/>
                </circle>

                <!-- ====================== 只在这里新增2个基区底部空穴，其余完全不动 ====================== -->
                <circle cx="105" cy="60" r="3" stroke="black" stroke-width="1" fill="white">
                    <animate attributeName="cx" from="95" to="40" dur="2.2s" fill="freeze" begin="0s;all.end" restart="always"/>
                </circle>
                <circle cx="115" cy="85" r="3" stroke="black" stroke-width="1" fill="white">
                    <animate attributeName="cx" from="105" to="20" dur="2.2s" fill="freeze" begin="0s;all.end" restart="always"/>
                </circle>

                <!-- ====================== 【新增1】集电区空穴 → 向基区运动 ====================== -->
                <circle cx="160" cy="70" r="3" stroke="black" stroke-width="1" fill="white">
                    <animate attributeName="cx" from="160" to="105" dur="2.2s" fill="freeze" begin="0s;all.end" restart="always"/>
                </circle>

                <!-- ====================== 【新增2】基区自由电子 → 向集电区运动 ====================== -->
                <circle cx="90" cy="80" r="2.5" fill="black">
                    <animate attributeName="cx" from="105" to="160" dur="2.2s" fill="freeze" begin="0s;all.end" restart="always"/>
                </circle>

                <!-- 复合电子：速度完全一致 ====================== -->
                <circle cx="20" cy="30" r="2.5" fill="black">
                    <animate attributeName="cx" from="20" to="90" dur="1s" fill="freeze" begin="0s;all.end" restart="always"/>
                    <animate attributeName="opacity" from="1" to="0.3" dur="0.2s" begin="0.8s" fill="freeze"/>
                    <animate attributeName="opacity" from="1" to="1" dur="0s" begin="2.2s" fill="freeze"/>
                </circle>
                <circle cx="25" cy="50" r="2.5" fill="black">
                    <animate attributeName="cx" from="25" to="100" dur="1s" fill="freeze" begin="0s;all.end" restart="always"/>
                    <animate attributeName="opacity" from="1" to="0.3" dur="0.2s" begin="0.8s" fill="freeze"/>
                    <animate attributeName="opacity" from="1" to="1" dur="0s" begin="2.2s" fill="freeze"/>
                </circle>
                <circle cx="30" cy="70" r="2.5" fill="black">
                    <animate attributeName="cx" from="30" to="95" dur="1s" fill="freeze" begin="0s;all.end" restart="always"/>
                    <animate attributeName="opacity" from="1" to="0.3" dur="0.2s" begin="0.8s" fill="freeze"/>
                    <animate attributeName="opacity" from="1" to="1" dur="0s" begin="2.2s" fill="freeze"/>
                </circle>

                <!-- 所有电子速度完全统一 ====================== -->
                <circle cx="10" cy="15" r="2.5" fill="black"><animate id="all" attributeName="cx" from="10" to="180" dur="2.2s" fill="freeze" begin="0s;all.end" restart="always"/></circle>
                <circle cx="15" cy="25" r="2.5" fill="black"><animate attributeName="cx" from="15" to="185" dur="2.2s" fill="freeze" begin="0s;all.end" restart="always"/></circle>
                <circle cx="20" cy="35" r="2.5" fill="black"><animate attributeName="cx" from="20" to="190" dur="2.2s" fill="freeze" begin="0s;all.end" restart="always"/></circle>
                <circle cx="25" cy="45" r="2.5" fill="black"><animate attributeName="cx" from="25" to="195" dur="2.2s" fill="freeze" begin="0s;all.end" restart="always"/></circle>
                <circle cx="30" cy="15" r="2.5" fill="black"><animate attributeName="cx" from="30" to="200" dur="2.2s" fill="freeze" begin="0s;all.end" restart="always"/></circle>
                <circle cx="35" cy="25" r="2.5" fill="black"><animate attributeName="cx" from="35" to="205" dur="2.2s" fill="freeze" begin="0s;all.end" restart="always"/></circle>
                <circle cx="40" cy="35" r="2.5" fill="black"><animate attributeName="cx" from="40" to="210" dur="2.2s" fill="freeze" begin="0s;all.end" restart="always"/></circle>
                <circle cx="45" cy="45" r="2.5" fill="black"><animate attributeName="cx" from="45" to="215" dur="2.2s" fill="freeze" begin="0s;all.end" restart="always"/></circle>
                <circle cx="5" cy="30" r="2.5" fill="black"><animate attributeName="cx" from="5" to="220" dur="2.2s" fill="freeze" begin="0s;all.end" restart="always"/></circle>
                <circle cx="10" cy="50" r="2.5" fill="black"><animate attributeName="cx" from="10" to="225" dur="2.2s" fill="freeze" begin="0s;all.end" restart="always"/></circle>
                <circle cx="15" cy="70" r="2.5" fill="black"><animate attributeName="cx" from="15" to="230" dur="2.2s" fill="freeze" begin="0s;all.end" restart="always"/></circle>
                <circle cx="20" cy="10" r="2.5" fill="black"><animate attributeName="cx" from="20" to="235" dur="2.2s" fill="freeze" begin="0s;all.end" restart="always"/></circle>
                <circle cx="25" cy="60" r="2.5" fill="black"><animate attributeName="cx" from="25" to="240" dur="2.2s" fill="freeze" begin="0s;all.end" restart="always"/></circle>
                <circle cx="35" cy="10" r="2.5" fill="black"><animate attributeName="cx" from="35" to="175" dur="2.2s" fill="freeze" begin="0s;all.end" restart="always"/></circle>
                <circle cx="45" cy="70" r="2.5" fill="black"><animate attributeName="cx" from="45" to="170" dur="2.2s" fill="freeze" begin="0s;all.end" restart="always"/></circle>
                <circle cx="50" cy="50" r="2.5" fill="black"><animate attributeName="cx" from="50" to="165" dur="2.2s" fill="freeze" begin="0s;all.end" restart="always"/></circle>
                <circle cx="55" cy="60" r="2.5" fill="black"><animate attributeName="cx" from="55" to="160" dur="2.2s" fill="freeze" begin="0s;all.end" restart="always"/></circle>

            </g>

            <!-- ====================== ✅ 红色水平向左箭头 + I_E 标注 ====================== -->
            <line x1="280" y1="145" x2="250" y2="145" stroke="red" stroke-width="2" />
            <polygon points="248,145 256,141 256,149" fill="red" />
            <foreignObject x="245" y="125" width="40" height="20">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px; text-align:center; color:red;">\(I_\mathrm{E}\)</div>
            </foreignObject>

            <!-- ====================== ✅ 红色水平向左箭头 + I_C 标注 ====================== -->
            <line x1="595" y1="145" x2="565" y2="145" stroke="red" stroke-width="2" />
            <polygon points="563,145 571,141 571,149" fill="red" />
            <foreignObject x="561" y="125" width="40" height="20">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px; text-align:center; color:red;">\(I_\mathrm{C}\)</div>
            </foreignObject>

            <!-- ====================== ✅ 红色水平向上箭头 + I_B 标注 ====================== -->
            <line x1="398" y1="240" x2="398" y2="270" stroke="red" stroke-width="2" />
            <polygon points="398,237 394,245 402,245" fill="red" />
            <foreignObject x="365" y="245" width="40" height="20">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px; text-align:center; color:red;">\(I_\mathrm{B}\)</div>
            </foreignObject>

            <rect x="240" y="200" width="20" height="50" fill="#eee" stroke="#333" stroke-width="1.5" />
            <foreignObject x="203" y="215" width="50" height="20">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px; text-align:center;">\(R_\mathrm{B}\)</div>
            </foreignObject>

            <rect x="585" y="200" width="20" height="50" fill="#eee" stroke="#333" stroke-width="1.5" />
            <foreignObject x="590" y="215" width="50" height="20">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px; text-align:center;">\(R_\mathrm{C}\)</div>
            </foreignObject>

            <line x1="330" y1="270" x2="330" y2="300" stroke="#000" stroke-width="2" />
            <line x1="320" y1="275" x2="320" y2="295" stroke="#000" stroke-width="1.5" />
            <foreignObject x="300" y="252" width="50" height="20">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px; text-align:center;">\(U_\mathrm{B}\)</div>
            </foreignObject>

            <line x1="500" y1="270" x2="500" y2="300" stroke="#000" stroke-width="2" />
            <line x1="490" y1="275" x2="490" y2="295" stroke="#000" stroke-width="1.5" />
            <line x1="510" y1="275" x2="510" y2="295" stroke="#000" stroke-width="1.5" />
            <line x1="520" y1="270" x2="520" y2="300" stroke="#000" stroke-width="2" />
            <foreignObject x="480" y="252" width="50" height="20">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px; text-align:center;">\(U_\mathrm{C}\)</div>
            </foreignObject>

            <path d="M 290 150 L 250 150 L 250 200" class="wire" />
            <path d="M 250 250 L 250 285 L 320 285" class="wire" />
            <path d="M 330 285 L 400 285" class="wire" />
            <path d="M 560 150 L 595 150 L 595 200" class="wire" />
            <path d="M 595 250 L 595 285 L 520 285" class="wire" />
            <path d="M 490 285 L 400 285" class="wire" />
            <path d="M 405 210 L 405 285 L 405 305" class="wire" />
            <path d="M 390 305 L 420 305" class="wire" />
        </svg>
    </div>
</div>
</body>
</html>
