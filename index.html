<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟电子技术课程知识点 - 北京交通大学</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #f5f7fa;
            padding: 20px;
            line-height: 1.8;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .content {
            font-size: 18px;
            color: #34495e;
            text-align: center;
            margin-bottom: 20px;
        }

        .maker {
            font-size: 18px;
            color: #2980b9;
            text-align: center;
            font-weight: 500;
            margin-top: 40px;
        }

        hr {
            border: none;
            height: 1px;
            background-color: #eee;
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">模拟电子技术课程知识点H5展示</div>
        
        <hr>

        <div class="content">
            免费分享给所有讲授该课程的教师以及学习该课程的学生
        </div>

        <div class="maker">
            制作者：北京交通大学电子信息工程学院 霍炎
        </div>
    </div>
</body>
</html>
